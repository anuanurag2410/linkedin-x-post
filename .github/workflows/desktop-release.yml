name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  mac:
    name: Build macOS DMG
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build macOS desktop app
        run: npm run desktop:build:mac

      - name: Verify DMG
        run: test -f dist/Post-Studio-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-studio-macos
          path: dist/Post-Studio-macOS.dmg
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows desktop app
        run: npm run desktop:build:win

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Post-Studio-Windows.exe")) {
            throw "Windows installer was not created."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-studio-windows
          path: dist/Post-Studio-Windows.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - mac
      - windows

    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: post-studio-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*               --repo "${{ github.repository }}"               --clobber
          else
            gh release create "$TAG" release-assets/*               --repo "${{ github.repository }}"               --target "${{ github.sha }}"               --title "Post Studio $TAG"               --generate-notes
          fi
